# ============================================================
# Kitty config - Kubuntu / KDE
# Zsh + JetBrains Mono + Gruvbox Dark
# ============================================================


# ------------------------------------------------------------
# SHELL
# ------------------------------------------------------------

shell zsh


# ------------------------------------------------------------
# FONT
# ------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 9.5

# Slightly adjust spacing if desired
modify_font cell_height 100%
modify_font cell_width 100%


# ------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0


# ------------------------------------------------------------
# WINDOW
# ------------------------------------------------------------

window_padding_width 4
window_border_width 1pt

# Keep KDE blur handling separate
# background_blur 0

# Remember previous window dimensions
remember_window_size yes

# Don't flash/bell
enable_audio_bell no
visual_bell_duration 0.0


# ------------------------------------------------------------
# SCROLLBACK
# ------------------------------------------------------------

scrollback_lines 10000

wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0


# ------------------------------------------------------------
# MOUSE
# ------------------------------------------------------------

mouse_hide_wait 3.0

# URLs are clickable
url_style curly

open_url_with default

detect_urls yes

copy_on_select no


# ------------------------------------------------------------
# CLIPBOARD
# ------------------------------------------------------------

copy_on_select clipboard

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

mouse_map right press grabbed,ungrabbed paste_from_clipboard

# ------------------------------------------------------------
# TABS
# ------------------------------------------------------------

tab_bar_edge bottom

tab_bar_style powerline
tab_powerline_style round

tab_bar_align left

active_tab_font_style bold
inactive_tab_font_style normal

tab_title_template "{index}: {title}"


# ------------------------------------------------------------
# LAYOUTS
# ------------------------------------------------------------

enabled_layouts splits,tall,fat,grid,stack


# ------------------------------------------------------------
# WINDOWS / SPLITS
# ------------------------------------------------------------

# New pane/window in current directory
map ctrl+shift+enter launch --cwd=current

# Vertical split
map alt+\ launch --location=vsplit --cwd=current

# Horizontal split
map alt+- launch --location=hsplit --cwd=current


# ------------------------------------------------------------
# PANE NAVIGATION
# Vim-like movement
# ------------------------------------------------------------

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right


# ------------------------------------------------------------
# PANE RESIZING
# ------------------------------------------------------------

map alt+shift+h resize_window narrower 3
map alt+shift+l resize_window wider 3
map alt+shift+k resize_window taller 3
map alt+shift+j resize_window shorter 3


# ------------------------------------------------------------
# TABS
# ------------------------------------------------------------

# New tab in current directory
map ctrl+t launch --type=tab --cwd=current
map ctrl+w close_tab

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Direct tab selection
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9


# ------------------------------------------------------------
# LAYOUT SHORTCUTS
# ------------------------------------------------------------

map ctrl+shift+space next_layout


# ------------------------------------------------------------
# FONT SIZE SHORTCUTS
# ------------------------------------------------------------

map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0


# ------------------------------------------------------------
# OPACITY SHORTCUTS
# ------------------------------------------------------------

map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default


# ------------------------------------------------------------
# KITTY HINTS
# ------------------------------------------------------------

# Select/open URLs
map ctrl+shift+u kitten hints --type url

# Select paths
map ctrl+shift+p kitten hints --type path


# ------------------------------------------------------------
# CONFIG
# ------------------------------------------------------------

# Reload config
map ctrl+shift+f5 load_config_file

# Edit kitty.conf
map ctrl+shift+f2 edit_config_file

# Theme
include theme.conf
